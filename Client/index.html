<!doctype html>
<!--
  The game is dark and only dark. Saying so on the root element rather than leaving it to
  prefers-color-scheme means Bootstrap resolves its dark palette for everyone, including a player
  whose system is set to light.
-->
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the layout reach under a notch and rounded corners; the CSS pays that
      back with safe-area padding, so the bottom tab bar clears the home indicator instead of
      sitting beneath it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      SVG first for anything modern, .ico as the fallback every other browser still asks for by
      convention. The .ico carries 16, 32 and 48 so Windows picks its own rather than scaling one.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e1111" />
    <meta
      name="description"
      content="Street Empire is an old-school browser strategy crime sim: build a crew, move product, hold territory, and climb a live city ladder."
    />
    <meta name="application-name" content="Street Empire" />
    <meta name="apple-mobile-web-app-title" content="Street Empire" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Street Empire" />
    <meta property="og:title" content="Street Empire" />
    <meta
      property="og:description"
      content="Build a crew, hold ground, move product, and fight for rank in a live browser strategy city."
    />
    <meta property="og:image" content="/screenshots/landing-desktop.png" />
    <meta property="og:image:alt" content="Street Empire landing preview with live stats, territory, and leaderboard panels." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Street Empire" />
    <meta
      name="twitter:description"
      content="A live browser strategy crime sim about crews, territory, markets, and rank."
    />
    <meta name="twitter:image" content="/screenshots/landing-desktop.png" />
    <!-- Replaced by vite from the VERSION file. Never type a number here. -->
    <title>Street Empire __APP_VERSION__</title>
    <!--
      Display preferences, applied before the bundle loads. They are read again properly in
      preferences.ts; this exists only so a compact layout does not arrive a frame late as a visible
      jump. It is wrapped because localStorage throws rather than returns nothing in a private window.
    -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('se.preferences') || '{}');
        if (p.compact === true) document.documentElement.setAttribute('data-density', 'compact');
        var reduced = p.reduceMotion === true || (p.reduceMotion == null
          && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (reduced) document.documentElement.setAttribute('data-motion', 'reduced');
      } catch (e) { /* storage refused; the bundle applies them a frame later */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
