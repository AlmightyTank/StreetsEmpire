<!doctype html>
<!--
  The game is dark and only dark. Saying so on the root element rather than leaving it to
  prefers-color-scheme means Bootstrap resolves its dark palette for everyone, including a player
  whose system is set to light.
-->
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the layout reach under a notch and rounded corners; the CSS pays that
      back with safe-area padding, so the bottom tab bar clears the home indicator instead of
      sitting beneath it.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      SVG first for anything modern, .ico as the fallback every other browser still asks for by
      convention. The .ico carries 16, 32 and 48 so Windows picks its own rather than scaling one.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e1111" />
    <title>Street Empire 0.2.5</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
