# Street Empire on a server: the app, TLS in front of it, and dumps of a database that lives outside
# this file.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres is installed on the VPS itself and is deliberately not a service here. It was one, on a named
# volume, and the data was permanent that way - a volume outlives every container that mounts it, which
# was demonstrated by destroying the container and counting the rows afterwards. Running it on the host
# buys something else: it keeps running when Docker does not, it is patched by the same apt that patches
# the rest of the box, and its data sits in a directory you can look at rather than inside a volume you
# have to go through Docker to reach. The README section "Postgres on the host" is the move itself.
#
# Every value that matters comes from a .env file sitting beside this one. There is nothing secret in
# here, which is what makes it safe to commit; see .env.example for what to put next to it.
#
# The plain docker-compose.yml is the development database on its own, and is left alone - running
# `docker compose up` on a laptop should keep doing what it always did.

# No container_name anywhere below, deliberately. A fixed name is claimed globally rather than per
# project, so two stacks that both want it get a collision rather than two stacks - which is what
# happened when this file and the development one both named a postgres container. Compose names them
# from the project instead, and `docker compose -f docker-compose.prod.yml logs -f api` reaches them
# whatever it called them.

# DOMAIN is the one value the rest is built from: the certificates Caddy asks for, the origin the app
# calls its own, and both Discord addresses. PUBLIC_URL is derived from it as https://$DOMAIN, and is
# only worth setting by hand when testing somewhere that is not on TLS.

# POSTGRES_HOST is the other one, and it has no default on purpose. From inside a container the VPS is
# the gateway of the network at the bottom of this file - 172.28.0.1, pinned there so that the address
# is fixed and pg_hba.conf on the host can name this range in one line rather than guess at it. Written
# down once, in .env, because the alternative is a default in here that has to agree with a hand-edited
# file on the host, and two copies of an address is how a database ends up unreachable after a reboot.

# Container logs, bounded. Docker's default json-file driver keeps everything for ever, so on a box
# that is only ever restarted for a deploy the logs are a slow leak with a disk at the end of it - and a
# full disk on this VPS stops Postgres writing, which stops the game. Fifty megabytes a service is more
# scrollback than anybody reads and a fixed ceiling either way.
#
# Written once and pointed at from each service, because three copies of a limit is two that get raised
# and one that does not.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    # Built by CI and pulled from here, rather than built on the VPS. A server that builds its own image
    # runs the .NET SDK and a Vite bundle on the machine currently serving the game, for minutes, and
    # what it produces is an image no test ever ran against. The publish job only runs for a commit that
    # went green, so what lands here has passed.
    #
    # IMAGE_TAG pins it. Leave it alone for the newest build of main; set it to a version - 0.2.7 - or to
    # a full commit sha to go back to one, which is what a rollback is now.
    image: ${IMAGE:-ghcr.io/almightytank/streetsempire}:${IMAGE_TAG:-latest}
    logging: *logging
    # Still here so the image can be built by hand - `up -d --build` - for testing a change that is not
    # pushed yet. It is not what a deploy does.
    build:
      context: .
      dockerfile: Dockerfile
    # Nothing left in this file to depend on, and the ordering that used to buy is covered by the restart
    # policy instead. The app migrates on boot, so if Docker comes back from a reboot before Postgres
    # does, the migration fails, the container exits, and this brings it straight back until the database
    # is answering.
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Behind Caddy, so believe it about the caller's scheme and address. Without this the session
      # cookie loses its Secure flag and every anonymous caller shares one rate-limit bucket.
      Proxy__TrustForwardedHeaders: "true"
      ConnectionStrings__GameDatabase: >-
        Host=${POSTGRES_HOST:?set POSTGRES_HOST in .env, e.g. 172.28.0.1};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-street_empire};Username=${POSTGRES_USER:-street_empire};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      # The key ring, on a volume. Without this every deploy silently signs out every player and voids
      # every outstanding verification and reset code - see the comment in Program.cs.
      DataProtection__KeyPath: /keys

      # One origin now that the client is served from here, so this is only still read by the Discord
      # return-url guard.
      Cors__AllowedOrigins__0: ${PUBLIC_URL:-https://${DOMAIN}}

      Auth__Discord__ClientId: ${DISCORD_CLIENT_ID:-}
      Auth__Discord__ClientSecret: ${DISCORD_CLIENT_SECRET:-}
      # Must match the Discord application character for character.
      Auth__Discord__RedirectUri: ${PUBLIC_URL:-https://${DOMAIN}}/api/auth/discord/callback
      Auth__Discord__ReturnUrl: ${PUBLIC_URL:-https://${DOMAIN}}/

      Announcements__DiscordWebhookUrl: ${DISCORD_ANNOUNCEMENT_WEBHOOK:-}
      Discord__BotToken: ${DISCORD_BOT_TOKEN:-}
      Discord__ApplicationId: ${DISCORD_APPLICATION_ID:-}
      Discord__PublicKey: ${DISCORD_PUBLIC_KEY:-}
      Discord__GuildId: ${DISCORD_GUILD_ID:-}
      Discord__LinkedRoleId: ${DISCORD_LINKED_ROLE_ID:-}
      Discord__TopTenRoleId: ${DISCORD_TOP_TEN_ROLE_ID:-}
      Discord__CrewBossRoleId: ${DISCORD_CREW_BOSS_ROLE_ID:-}

      Auth__Email__ApiKey: ${RESEND_API_KEY:-}
      Auth__Email__FromAddress: ${MAIL_FROM:-Street Empire <onboarding@resend.dev>}
    volumes:
      - street-empire-keys:/keys
    networks:
      - street-empire
    # No host port at all. Caddy reaches it over the compose network and nothing else can, which is
    # also the condition that makes trusting X-Forwarded-* safe - see the comment in Program.cs.
    # To reach it directly while debugging:
    #   docker compose -f docker-compose.prod.yml exec api curl -s localhost:8080/api/health

  # Dumps of the game database, on a schedule, checked and pruned. Still a container even though the
  # database is not: the script it runs is the tested one, and the tag pins the pg_dump that takes the
  # dumps. That pin matters more now rather than less - pg_dump refuses to dump a server newer than
  # itself, so this has to keep up with the major version apt installs on the host, and the day it stops
  # keeping up is a day the backups stop without saying so.
  backup:
    image: postgres:17
    logging: *logging
    # The script waits on pg_isready in a loop rather than being ordered after anything, which is what it
    # always did - compose only ever gated the first start, never a restart of this container on its own.
    restart: unless-stopped
    environment:
      # No :? here; the api above already refuses to start without it.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-street_empire}
      POSTGRES_USER: ${POSTGRES_USER:-street_empire}
      # On the container rather than only inside the script, so that a pg_restore run by hand through
      # `docker compose exec backup` inherits it too. Restoring at three in the morning should not also
      # be a password hunt.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./ops/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      # A bind mount rather than a named volume, on purpose: dumps that live inside Docker are dumps
      # nobody copies off the machine, and a backup that only exists on the box it is backing up is
      # not a backup of that box.
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - street-empire
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]

  # TLS, and the only thing on this stack the internet can reach.
  caddy:
    image: caddy:2-alpine
    logging: *logging
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The bare hostname, not a URL. Caddy builds both the apex and the www redirect from it, and it
      # cannot prefix "www." onto something that starts with https://.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. streetsempire.dev}
    ports:
      - "80:80"
      - "443:443"
      # QUIC. Harmless if the host firewall drops it; browsers fall back to TCP.
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys live here, and this volume is not optional. Without it every
      # redeploy asks Let's Encrypt for a fresh certificate, and Let's Encrypt permits five per domain
      # per week - so the fifth deploy of a bad week is the one where the site stops having TLS at all.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - street-empire

volumes:
  caddy-data:
  caddy-config:
  street-empire-keys:

networks:
  street-empire:
    driver: bridge
    # Pinned, rather than taken from Docker's pool. Two things have to agree on an address that Docker
    # would otherwise be free to change whenever a network is recreated: the containers, which reach the
    # database at the gateway, and pg_hba.conf on the host, which decides who is allowed to connect at
    # all. A fixed subnet turns the second into one line naming this range and nothing else.
    #
    # If 172.28.0.0/16 collides with something already on the box, compose says so at startup rather
    # than half-working. Change it here, in POSTGRES_HOST, and in pg_hba.conf - all three or none.
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
