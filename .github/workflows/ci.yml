# Continuous integration.
#
# There are 170 tests in this repository and, until this file existed, they ran when somebody
# remembered to run them. That is not a test suite, it is a collection of scripts - and the one class
# of fault it exists to catch is precisely the one nobody thinks to check for before pushing.
#
# Three jobs rather than one, so a failure names itself: a red "server" is not a red "client", and
# reading which box went red should not require opening the log.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a broken main can be re-checked without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first one's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read by default; the publish job asks for the one extra it needs and nothing else.
permissions:
  contents: read

jobs:
  server:
    name: Server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore StreetEmpire.sln
      - name: Build
        # Warnings are worth seeing but are not yet worth failing on: the build is clean today, and
        # the day it is not, the person who dirtied it should be told rather than blocked.
        run: dotnet build StreetEmpire.sln --no-restore --configuration Release

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # No database service here on purpose. The suite never opens a connection: the one place it
      # builds a DbContext points at a database that does not exist, because what it is checking is
      # that a LINQ query translates to SQL, not what the SQL returns. A Postgres container would be
      # thirty seconds of nothing.
      - name: Run the suite
        run: dotnet run --project Tests/StreetEmpire.Tests/StreetEmpire.Tests.csproj --configuration Release

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Install
        run: npm ci
      # `npm run build` is `tsc -b && vite build`, so this covers both the type check and the bundle,
      # including the Sass compile that the whole interface now depends on.
      - name: Typecheck and build
        run: npm run build

  # ---------------------------------------------------------------------------------------------
  publish:
    name: Publish image
    # The reason this lives here rather than in a workflow of its own: needs. An image is only built
    # for a commit that passed all three jobs above, so there is no such thing as a published image
    # nobody tested. A separate workflow would have had to re-run them or trust that they passed.
    needs: [server, tests, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the name and the version
        id: naming
        # Registries take lowercase only, and the repository is not spelled that way. Derived rather
        # than typed so that renaming the repository does not quietly publish to the old name forever.
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Issued for this run and expires with it. No stored credential to leak or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Stamped into the assembly, so /api/health reports the commit it was built from.
          build-args: GIT_SHA=${{ github.sha }}
          # Three tags doing three jobs. `latest` is what a deploy takes; the version is what a human
          # says out loud; the sha is the only one of the three that never moves, which makes it the
          # one worth pinning to when going back.
          tags: |
            ${{ steps.naming.outputs.image }}:latest
            ${{ steps.naming.outputs.image }}:${{ steps.naming.outputs.version }}
            ${{ steps.naming.outputs.image }}:${{ github.sha }}
          # Without this every build reinstalls node_modules and restores NuGet from nothing.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was published
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.naming.outputs.image }}:${{ steps.naming.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.naming.outputs.image }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
